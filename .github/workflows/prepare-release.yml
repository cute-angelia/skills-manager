name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          case "$RELEASE_TYPE" in
            patch|minor|major) ;;
            *) echo "Invalid release type" >&2; exit 1 ;;
          esac
          npm run release:prepare -- "$RELEASE_TYPE"

      - name: Commit and tag
        id: release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          git add CHANGELOG.md CHANGELOG-zh.md package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock assets/star-history.svg
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push --follow-tags origin HEAD:main
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger another push workflow. Dispatch on
      # the new tag explicitly, preserving tag context in every release job.
      - name: Trigger release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
